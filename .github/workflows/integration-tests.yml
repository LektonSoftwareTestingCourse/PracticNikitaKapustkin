name: Practice 6 integration tests

on:
  workflow_dispatch:
  push:
    branches: ['practice-6-*']

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: First run
        run: mvn -B -f services/pom.xml -Pintegration-tests clean verify
      - name: Second run
        run: mvn -B -f services/pom.xml -Pintegration-tests verify
